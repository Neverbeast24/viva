name: vivrant_mobile
description: "VIVRΛNT Mobile — Every Choice Shapes Your Health"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  url_launcher: ^6.3.1
  supabase_flutter: ^2.9.0
  equatable: ^2.0.7
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  camera: ^0.12.0+1
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  audioplayers: ^6.5.1
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/vivrant-mark.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/brand/vivrant-mark.png
  remove_alpha_ios: true

flutter_native_splash:
  # Color-only native splash — Flutter SplashScreen owns the centered brand glow.
  color: "#0C1210"
  android: true
  ios: true
  android_12:
    color: "#0C1210"
    icon_background_color: "#0C1210"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
